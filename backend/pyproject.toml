[project]
name = "backend"
version = "0.1.0"
description = "AI powered custom server training platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.14",
    "djangorestframework>=3.17.1",
    "django-filter>=25.2",
    "markdown>=3.10.2",
    "psycopg2>=2.9.12",
    "python-dotenv>=1.2.2",
    "drf-spectacular>=0.29.0",
    "factory-boy>=3.3.3",
    "djangorestframework-simplejwt>=5.5.1",
    "django-cors-headers>=4.9.0",
    "requests>=2.34.2",
    "redis>=8.1.0",
    "celery>=5.6.3",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "servox.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "--reuse-db --strict-markers"
